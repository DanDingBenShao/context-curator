[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-curator"
version = "0.2.0"
description = "Pluggable LLM context lifecycle management — dual-score dormancy, compression, pin, and budget-aware curation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]

[tool.setuptools.packages.find]
include = ["context_curator*"]
